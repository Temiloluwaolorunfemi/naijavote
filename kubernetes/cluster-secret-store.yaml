apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://18.220.229.52:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-ca-cert
        namespace: external-secrets
        key: ca.crt
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
