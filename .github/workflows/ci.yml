name: CI for NaijaVote
on: 
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        - name: Build and test with Maven
          run: mvn --batch-mode --update-snapshots clean verify
    
        
    docker:
        runs-on: ubuntu-latest
        needs: build
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        # - name: Retrieve Docker credentials from harshicorp vault
        #   uses: hashicorp/vault-action@v2
        #   with:
        #     url: ${{ secrets.VAULT_ADDR }}
        #     method: approle
        #     roleId: ${{ secrets.VAULT_ROLE_ID }}
        #     secretId: ${{ secrets.VAULT_SECRET_ID }}
        #     secrets: |
        #       docker-username secret/data/docker#username
        #       docker-password secret/data/docker#password
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v4
          with:
            context: .
            file: Dockerfile
            push: true
            tags: temiloluwaolorunfemi/naijavote:${{ github.run_id }}
    
    k8s-update-manifest:
        runs-on: ubuntu-latest
        needs: docker
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Update Kubernetes manifest with new image tag
          run: |
            IMAGE_TAG=${{ github.run_id }}
            sed -i -E "s|(image: temiloluwaolorunfemi/naijavote:)[^[:space:]]+|\1${IMAGE_TAG}|g" kubernetes/naijavote-deployment.yml

        - name: Commit and push updated manifest
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add kubernetes/naijavote-deployment.yml
            if git diff --cached --quiet; then
              echo "Manifest already uses image tag ${{ github.run_id }}"
            else
              git commit -m "Update deployment manifest with new image tag ${{ github.run_id }} [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi

    deploy-argocd:
        runs-on: self-hosted
        needs: k8s-update-manifest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Verify local kind cluster access
          shell: bash
          run: |
            kubectl config current-context
            kubectl cluster-info
            kubectl get namespace argocd

        - name: Apply Argo CD application
          shell: bash
          run: kubectl apply -f argocd/application.yml -n argocd
