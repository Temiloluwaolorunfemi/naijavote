name: CI for NaijaVote
on: 
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        - name: Build and test with Maven
          run: mvn --batch-mode --update-snapshots clean verify
    
        
    docker:
        runs-on: ubuntu-latest
        needs: build
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        # - name: Retrieve Docker credentials from harshicorp vault
        #   uses: hashicorp/vault-action@v2
        #   with:
        #     url: ${{ secrets.VAULT_ADDR }}
        #     method: approle
        #     roleId: ${{ secrets.VAULT_ROLE_ID }}
        #     secretId: ${{ secrets.VAULT_SECRET_ID }}
        #     secrets: |
        #       docker-username secret/data/docker#username
        #       docker-password secret/data/docker#password
        
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v4
          with:
            context: .
            file: Dockerfile
            push: true
            tags: temiloluwaolorunfemi/naijavote:{{ github.run_id }}
    
    k8s-update-manifest:
        runs-on: ubuntu-latest
        needs: docker
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Update Kubernetes manifest with new image tag
          run: |
            IMAGE_TAG=${{ github.run_id }}
            sed -i "s|image: temiloluwaolorunfemi/naijavote:latest|image: temiloluwaolorunfemi/naijavote:{{ github.run_id }}|g" kubernetes/deployment.yml

        - name: Commit and push updated manifest
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add kubernetes/deployment.yml
            git commit -m "Update deployment manifest with new image tag ${{ github.run_id }}"
            git push origin main